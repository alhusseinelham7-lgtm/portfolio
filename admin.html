<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة البورتفوليو</title><link rel="stylesheet" href="assets/css/style.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><div class="admin-logo">إدارة البورتفوليو</div><div class="admin-nav"><button class="active" data-tab="#sitePanel">نصوص الموقع</button><button data-tab="#projectsPanel">المشاريع</button><a href="index.html">عرض الموقع ↗</a></div></aside><main class="admin-main"><div class="admin-head"><div><h1>عدّل كل شيء من هون</h1><p>النصوص، المشاريع، الصور، ترتيبها، وأقسام صفحة المشروع.</p></div><button class="btn danger" onclick="resetAll()">إعادة ضبط</button></div><section id="sitePanel" class="admin-panel active"><div class="panel"><div class="panel-title"><h2>كل نصوص الموقع</h2></div><form id="siteForm" class="form-grid"><div class="field"><label>اسم الموقع</label><input name="brandName"></div><div class="field"><label>المسمى المهني</label><input name="role"></div><div class="field"><label>Hero — السطر الأول</label><input name="hero1"></div><div class="field"><label>Hero — السطر الأحمر</label><input name="hero2"></div><div class="field"><label>Hero — السطر الثالث</label><input name="hero3"></div><div class="field full"><label>وصف الـHero</label><textarea name="heroDescription"></textarea></div><div class="field"><label>وسم 1</label><input name="heroTag1"></div><div class="field"><label>وسم 2</label><input name="heroTag2"></div><div class="field full"><label>عنوان قسم الهويات</label><input name="brandingTitle"></div><div class="field full"><label>نص قسم الهويات</label><textarea name="brandingText"></textarea></div><div class="field full"><label>عنوان قسم الكاروسيلات</label><input name="carouselTitle"></div><div class="field full"><label>نص قسم الكاروسيلات</label><textarea name="carouselText"></textarea></div><div class="field full"><label>عنوان عنّي</label><input name="aboutTitle"></div><div class="field full"><label>نص عنّي</label><textarea name="aboutText"></textarea></div><div class="field"><label>الخدمة 1</label><input name="service1"></div><div class="field"><label>الخدمة 2</label><input name="service2"></div><div class="field"><label>الخدمة 3</label><input name="service3"></div><div class="field full"><label>عنوان التواصل</label><input name="contactTitle"></div><div class="field full"><label>نص التواصل</label><textarea name="contactText"></textarea></div><div class="field"><label>نص الزر</label><input name="contactButton"></div><div class="field"><label>الإيميل</label><input name="contactEmail"></div><div class="field full"><button class="btn" type="submit">حفظ النصوص</button></div></form></div></section><section id="projectsPanel" class="admin-panel"><div class="panel"><div class="panel-title"><h2>المشاريع</h2><button class="btn" onclick="openModal()">+ مشروع جديد</button></div><div style="overflow:auto"><table class="admin-table"><thead><tr><th>المشروع</th><th>النوع</th><th>التصنيف</th><th>السنة</th><th>الترتيب</th><th>الحالة</th><th></th></tr></thead><tbody id="projectRows"></tbody></table></div></div></section></main></div><div class="modal" id="projectModal"><div class="modal-card"><div class="modal-top"><h2>تحرير المشروع</h2><button class="close-modal" onclick="closeModal()">×</button></div><form id="projectForm" class="form-grid"><input type="hidden" name="originalId"><div class="field"><label>ID إنجليزي</label><input required name="id" placeholder="my-project"></div><div class="field"><label>اسم المشروع</label><input required name="title"></div><div class="field"><label>النوع</label><select name="type"><option value="branding">هوية بصرية</option><option value="carousel">كاروسيل</option></select></div><div class="field"><label>التصنيف الظاهر</label><input name="category"></div><div class="field"><label>السنة</label><input name="year"></div><div class="field"><label>الترتيب</label><input type="number" name="order"></div><div class="field full"><label>مسار الغلاف</label><input name="cover" placeholder="assets/images/..."></div><div class="field full"><label>السطر الصغير فوق العنوان</label><input name="eyebrow"></div><div class="field full"><label>وصف مختصر للقوائم</label><textarea name="short"></textarea></div><div class="field full"><label>مقدمة صفحة المشروع</label><textarea name="intro"></textarea></div><div class="field"><label>الدور</label><input name="role"></div><div class="field"><label>الخدمات</label><input name="services"></div><div class="field full"><label>مسارات الصور — كل صورة بسطر</label><textarea name="images" style="min-height:180px"></textarea></div><div class="field full"><label>أقسام المشروع بصيغة JSON</label><textarea name="sections" style="min-height:260px"></textarea></div><div class="field"><label><input type="checkbox" name="published"> منشور</label></div><div class="field"><label><input type="checkbox" name="featured"> مميز</label></div><div class="field full"><button class="btn" type="submit">حفظ المشروع</button></div></form></div></div><script src="assets/js/data.js"></script><script src="assets/js/admin.js"></script></body></html>
